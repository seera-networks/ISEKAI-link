# XcodeGen spec — this, not the .xcodeproj, is what the repo tracks.
#
#   ./build-rust.sh          # bindings + xcframework (must run first)
#   xcodegen generate        # writes IsekaiCameraClient.xcodeproj
#
# See README.md.
name: IsekaiCameraClient

options:
  bundleIdPrefix: tools.isekai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # XcodeGen defaults to the Xcode 16 file format. This one is older and every
  # Xcode since reads it happily, and the project is regenerated from this spec
  # anyway, so nothing is given up by asking for it.
  #
  # It was pinned because the `macos-14` runner's Xcode 15.4 refused the newer
  # format; that runner is retired now (actions/runner-images#13518) and CI is
  # on `macos-15`, so the original reason is gone. Kept because the setting
  # costs nothing and widens what can open the project -- not because 15.4 is
  # still a target.
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  IsekaiCameraClient:
    type: application
    platform: iOS
    sources:
      - path: IsekaiCameraClient/App
      # Written by build-rust.sh; absent on a fresh clone.
      - path: IsekaiCameraClient/Generated
        optional: true
    dependencies:
      # A static library xcframework: linked, never embedded.
      - framework: IsekaiCameraClient/Frameworks/IsekaiClientFFI.xcframework
        embed: false
    settings:
      base:
        # Placeholder — set a real identifier before TestFlight (Phase 5).
        PRODUCT_BUNDLE_IDENTIFIER: tools.isekai.viewer
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Rust staticlib brings its own std dependencies, and msquic's
        # darwin platform layer needs these two frameworks. rustc passes them
        # automatically when *it* drives the link; here Xcode does.
        OTHER_LDFLAGS:
          - -liconv
          - -framework
          - CoreFoundation
          - -framework
          - Security
    info:
      path: IsekaiCameraClient/Info.plist
      properties:
        CFBundleDisplayName: ISEKAI Viewer
        # Standard TLS/ECDSA only; no proprietary cryptography to declare.
        ITSAppUsesNonExemptEncryption: false
        # Shown when the pairing scanner first asks. Says what the camera is
        # for, because "this app would like to use the camera" on an app whose
        # whole purpose is watching a camera reads as something else entirely.
        NSCameraUsageDescription: >-
          Scanning the pairing code a camera displays. The camera is used for
          nothing else.
        UILaunchScreen: {}
        # Auth0 redirects back to this scheme. It is a constant rather than the
        # bundle identifier because sideloading rewrites the identifier to
        # append the signing team, which would change the redirect per machine.
        # Keep it in step with Auth0Config.callbackScheme and the Allowed
        # Callback URLs in the Auth0 dashboard.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: tools.isekai.viewer.auth0
            CFBundleURLSchemes:
              - isekaiviewer
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Drives the FFI directly rather than the UI: connect over the relay and wait
  # for a frame. Skips unless camera-core's synthetic_server is listening on the
  # host — see IsekaiCameraClientTests/ViewerConnectTests.swift.
  IsekaiCameraClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IsekaiCameraClientTests
    dependencies:
      - target: IsekaiCameraClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tools.isekai.viewer.tests
        GENERATE_INFOPLIST_FILE: YES

# Declared rather than left to Xcode's autocreation, so `xcodebuild -scheme`
# works against a freshly generated project.
schemes:
  IsekaiCameraClient:
    build:
      targets:
        IsekaiCameraClient: all
        IsekaiCameraClientTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IsekaiCameraClientTests
