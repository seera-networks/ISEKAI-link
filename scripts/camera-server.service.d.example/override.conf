# Copy this file to
# /etc/systemd/system/camera-server.service.d/override.conf (create that
# directory first) and fill in both values for your machine. This is a
# systemd drop-in: everything in it merges into camera-server.service at
# load time, without editing that file -- the standard mechanism for
# customizing a vendored unit. Directives given here replace the base
# unit's value of the same name (rather than appending), which is what's
# wanted for both of these.
#
# Why these two specifically can't just live in /etc/camera-server.env
# alongside CAMERA_SERVER_CHECKOUT/OPENCV_LIB_DIR: systemd only expands
# ${VAR} from Environment=/EnvironmentFile= inside Exec* command lines
# (systemd.exec(5)), never in plain directives like User=/
# SupplementaryGroups=. A drop-in is the only way to keep the base unit
# file itself untouched for these.

[Service]
# The user camera-server should run as.
User=YOUR_USER

# systemd does not load a service's supplementary groups from /etc/group
# the way a login session does -- User= alone gets only the primary group.
# The camera device (/dev/video0 on this hardware) is group `video`, and
# without this line the service starts, opens no camera, and reports
# nothing wrong until CAMERA_AUTOSTART's capture silently never begins.
# Check `ls -la /dev/video0` on your machine -- the group there is what
# belongs here, which may not be `video`.
SupplementaryGroups=video
