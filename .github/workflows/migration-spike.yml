name: P2P migration Phase 0 spike

# docs/p2p_mode_migration_plan.md, Phase 0: answer the open questions that decide
# whether the adopted design holds — 案B (pin the client's local address to a real
# interface address, dial loopback, add_candidate_addr) on the client, 案A
# (add_bound_addr / add_observed_addr on the accepted connection) on the server.
#
# `rust/camera-core/examples/migration_spike.rs` reproduces the P2P relay topology
# on one host with a pair of loopback sockets, so every check runs without a proxy,
# a relay or a NAT. Checks 1 and 2 are the load-bearing assumptions and fail the
# job; the rest record an answer either way.
#
# The matrix exists for risk #12: the original measurement behind 案B was taken on
# Linux only, and "a real-IP source can reach a loopback destination" is a kernel
# behaviour, not a portable guarantee. `fail-fast: false` so one platform's answer
# never hides another's.
#
# **It has since become the crate test runner too**, for `camera-core` and
# `isekai-p2p`, because nothing else in CI runs either one's tests and both turn
# out to have the same kind of question in them — see the test step below. The
# name is the spike; the scope is wider than the name.

on:
  push:
    paths:
      # The whole crate, not just the spike: the `cargo test -p camera-core`
      # step below is the only thing in CI that runs camera-core's tests, and
      # `tests/untrusted_chain.rs` and `tests/video_loopback.rs` are the only
      # coverage the real-connection paths have. Narrower paths meant a change
      # to `src/video.rs` ran none of them.
      - 'rust/camera-core/**'
      # The peer layer camera-core sits on, tested by the same step because
      # nothing else in CI does either.
      - 'rust/isekai-p2p/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/migration-spike.yml'
  pull_request:
    paths:
      # The whole crate, not just the spike: the `cargo test -p camera-core`
      # step below is the only thing in CI that runs camera-core's tests, and
      # `tests/untrusted_chain.rs` and `tests/video_loopback.rs` are the only
      # coverage the real-connection paths have. Narrower paths meant a change
      # to `src/video.rs` ran none of them.
      - 'rust/camera-core/**'
      # The peer layer camera-core sits on, tested by the same step because
      # nothing else in CI does either.
      - 'rust/isekai-p2p/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/migration-spike.yml'
  workflow_dispatch:

jobs:
  spike:
    name: Phase 0 spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same bootstrap the iOS workflow uses; seera-msquic needs its build
      # dependencies present before cargo drives its CMake build.
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build the spike
        run: cargo build -p camera-core --example migration_spike

      # On Windows the dev certificate is only usable through a PKCS#12 bundle;
      # check the bundle itself here so a failure is attributable to packaging
      # rather than showing up as six skipped msquic checks.
      - name: Check the dev certificate packaging
        # `--lib` used to be here, and it was hiding `tests/video_loopback.rs`:
        # that test hung forever, and nothing said so because nothing ran it.
        # Now that it terminates, the integration tests run too — they are the
        # only coverage the loopback path has.
        #
        # `isekai-p2p` is here for the same reason and on the same matrix: it
        # is the peer layer `camera-core` sits on, nothing else in CI runs its
        # tests, and what it classifies is `QUIC_STATUS` — an errno-shaped
        # `u32` on Linux and Android, a signed `HRESULT` on Windows. That is
        # the same "not a portable guarantee" this job's header is about, and
        # a Linux-only answer to it is how #141's first fix missed the platform
        # its own issue was reported from.
        run: cargo test -p camera-core -p isekai-p2p

      - name: Run the spike
        id: spike
        run: cargo run -q -p camera-core --example migration_spike | tee "$RUNNER_TEMP/spike-report.md"
        shell: bash

      # Two processes, and across the two settings that differ between this
      # spike and camera-core's video_client_config. The field failure survives
      # everything the single-process checks cover, so these are what is left.
      - name: Run the two-process spike
        run: |
          set -uo pipefail
          fail=0
          run_case() {
            local label="$1"; shift
            local port="$1"; shift
            local srv="$RUNNER_TEMP/spike-server-$port.log"
            env "$@" SPIKE_CONTROL=127.0.0.1:$port \
              cargo run -q -p camera-core --example migration_spike -- server > "$srv" 2>&1 &
            for _ in $(seq 1 60); do
              if grep -q 'waiting for the client' "$srv"; then break; fi
              sleep 1
            done
            local out
            out=$(env "$@" SPIKE_CONTROL=127.0.0.1:$port \
              cargo run -q -p camera-core --example migration_spike -- client 2>/dev/null \
              | grep -E '^(PASS|FAIL)' | head -1)
            if [ -z "$out" ]; then
              out="<no client output; server tail: $(tail -1 "$srv")>"
            fi
            echo "$label -> $out"
            case "$out" in PASS*) ;; *) fail=1 ;; esac
          }
          run_case 'two-process baseline            ' 57701 DUMMY=1
          # The two DestCidUpdate cases are gone with `SPIKE_PIN_DCID`: no
          # client config pins the destination CID any more, so both of them
          # were running the baseline under another name. What is left of the
          # second is its MTU, which is what `video_client_config` differs by.
          run_case 'two-process = video_client_config' 57702 SPIKE_MAX_MTU=1248
          exit $fail
        shell: bash

      # The example prints its report as a Markdown table, so it renders as-is.
      - name: Publish the report to the job summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo
            sed -n '/^| # |/,$p' "$RUNNER_TEMP/spike-report.md" || true
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-report-${{ matrix.os }}
          path: ${{ runner.temp }}/spike-report.md
          if-no-files-found: warn
