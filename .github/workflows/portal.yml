name: ISEKAI portal

# `portal-core` (docs/portal_plan.md phase 0) landed with nothing building it:
# migration-spike.yml tests `camera-core`, camera-apps.yml builds the two camera
# binaries, and the mobile workflows build the FFI crate. So the crate's green
# checks said nothing about the crate. This is #144.
#
# **All three platforms run the tests.** Windows did not until #155: whichever
# of the two integration tests ran second had a dial that never completed, and
# raising its budget only lengthened the wait.
#
# The cause was `multi_thread` test runtimes. `get_stats` is served by queueing
# an operation to msquic's connection worker and blocking the calling thread
# until it runs, and `peer::dial`'s handshake probe calls it every second while
# the handshake is still in flight -- so two runtimes on a two-core runner, each
# blocking into a different registration's worker, starved the future being
# reported on. `camera-core`'s equivalent tests are current-thread and never met
# it. `tcp_loopback.rs` says all of this at the top.
#
# Before that it was the certificate: `spike.rs` handed msquic a PEM and no
# PKCS#12, and the Windows credential path's no-PFX fallback cannot take an
# ECDSA P-256 key, so the listener could not start at all. Phase 1c-iii-b
# replaced that with `isekai_p2p::endpoint_cert`, which packages the bundle.
#
# The Windows job also builds vendored OpenSSL, which is what packaging that
# bundle costs. Making it optional was considered and rejected: with the feature
# off the bundle is silently `None`, msquic takes the RSA fallback again, and the
# failure moves from a slow CI job to `ASN1 bad tag value met` on a user's
# machine.

on:
  push:
    paths:
      - 'rust/portal-core/**'
      - 'rust/portal-server/**'
      - 'rust/portal-client/**'
      # What the forwarding now rides on. `transport` dials with
      # `isekai_p2p::peer` and binds with `isekai-link-utils`, and nothing else
      # in CI compiles `portal-core` -- migration-spike.yml tests `camera-core`
      # and `isekai-p2p`, camera-apps.yml builds the two camera binaries. So
      # without these a breaking change to `peer::dial` or to the listener
      # helper leaves portal broken and green until someone happens to touch its
      # directory, which is the #144 hole this file exists to close with the
      # dependency edge moved one crate over.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/portal.yml'
  pull_request:
    paths:
      - 'rust/portal-core/**'
      - 'rust/portal-server/**'
      - 'rust/portal-client/**'
      # What the forwarding now rides on. `transport` dials with
      # `isekai_p2p::peer` and binds with `isekai-link-utils`, and nothing else
      # in CI compiles `portal-core` -- migration-spike.yml tests `camera-core`
      # and `isekai-p2p`, camera-apps.yml builds the two camera binaries. So
      # without these a breaking change to `peer::dial` or to the listener
      # helper leaves portal broken and green until someone happens to touch its
      # directory, which is the #144 hole this file exists to close with the
      # dependency edge moved one crate over.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/portal.yml'
  workflow_dispatch:

jobs:
  test:
    name: Forward a TCP service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform's answer never hides another's, as migration-spike.yml
      # says for the same reason.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The integration tests stand up a real QUIC connection between the two
      # halves. They have hung this repository's CI before — see the header of
      # camera-core/tests/video_loopback.rs and the four ways portal-core's own
      # tests found — so the timeout above is the backstop, not the plan.
      - name: Test
        run: cargo test -p portal-core
      # **#155, one experiment.** The same two tests, serially and with the
      # dial talking. Whichever way this goes it halves the search:
      #
      # * passes serially -> the tests interfere through something
      #   process-global, and serialising them is a real fix rather than a
      #   workaround
      # * fails serially  -> the second dial fails on its own account, and the
      #   log below says why
      #
      # Ruled out already: the runtime shape (current-thread fails the same
      # way), msquic's API table (opened once, closed at process exit), the
      # certificate (the listener starts and the passing test reads a status
      # back), and two registrations per se (`video_loopback.rs` does that on
      # Windows and passes, through the same `peer::dial`).
      #
      # `continue-on-error` because this is a measurement, not a gate.
      - name: '#155: the same tests, serially and with logs'
        # `always()`, because the step above failing is exactly when this is
        # worth having -- without it the job stops at the failure and the
        # measurement never runs.
        if: always()
        continue-on-error: true
        env:
          RUST_LOG: isekai_p2p::peer=debug,msquic_async=debug
        run: cargo test -p portal-core --test tcp_loopback -- --test-threads=1 --nocapture
      # The binaries are not covered by the tests -- there is nothing to test
      # about them without a proxy -- so this is what says they still build.
      - name: Build the binaries
        run: cargo build -p portal-server -p portal-client

