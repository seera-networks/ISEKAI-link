name: ISEKAI portal

# `portal-core` (docs/portal_plan.md phase 0) landed with nothing building it:
# migration-spike.yml tests `camera-core`, camera-apps.yml builds the two camera
# binaries, and the mobile workflows build the FFI crate. So the crate's green
# checks said nothing about the crate. This is #144.
#
# **Linux and macOS run the tests; Windows compiles them** — #155, which is
# understood now and is not this repository's.
#
# On a GitHub-hosted windows-latest runner, the first parallel run after a build
# has one of the two dials complete in ~11ms and the other not complete at all:
# it was given three minutes and used all of them. The twenty runs immediately
# after, on the same machine in the same job, all pass — serial and parallel
# alike.
#
# It does not reproduce on real Windows hardware. `cargo clean -p portal-core`
# and a single run, which is exactly the failing condition, gives two dials at
# 24.7ms and two passes; twenty repeats also pass. So it is the hosted image,
# and the tests and the product are fine — the camera apps and portal both run
# on Windows.
#
# The dial is timed and the number printed, which is what finally separated
# "slow" from "never" after three wrong answers built on the budget alone. If
# this recurs, that line is the first thing to read.
#
# Before that it was the certificate: `spike.rs` handed msquic a PEM and no
# PKCS#12, and the Windows credential path's no-PFX fallback cannot take an
# ECDSA P-256 key, so the listener could not start at all. Phase 1c-iii-b
# replaced that with `isekai_p2p::endpoint_cert`, which packages the bundle.
#
# The Windows job also builds vendored OpenSSL, which is what packaging that
# bundle costs. Making it optional was considered and rejected: with the feature
# off the bundle is silently `None`, msquic takes the RSA fallback again, and the
# failure moves from a slow CI job to `ASN1 bad tag value met` on a user's
# machine.

on:
  push:
    # **`branches` has to be spelled out now that `tags` is here.** Naming
    # either one narrows the trigger to it, so `tags` on its own would have
    # turned every branch push into no run at all — the ordinary CI for this
    # crate, switched off in passing while adding a release.
    branches: ['**']
    tags: ['v*']
    # And the two are ANDed with the paths below, so a tag whose commits touch
    # nothing here does not start this workflow. `camera-apps.yml` has the same
    # shape and has fired for a tag, which is the evidence this is built on; a
    # release cut from a commit that changed only `docs/` would need a
    # `workflow_dispatch` run instead.
    paths:
      - 'rust/portal-core/**'
      - 'rust/portal-server/**'
      - 'rust/portal-client/**'
      # What the forwarding now rides on. `transport` dials with
      # `isekai_p2p::peer` and binds with `isekai-link-utils`, and nothing else
      # in CI compiles `portal-core` -- migration-spike.yml tests `camera-core`
      # and `isekai-p2p`, camera-apps.yml builds the two camera binaries. So
      # without these a breaking change to `peer::dial` or to the listener
      # helper leaves portal broken and green until someone happens to touch its
      # directory, which is the #144 hole this file exists to close with the
      # dependency edge moved one crate over.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/portal.yml'
  pull_request:
    paths:
      - 'rust/portal-core/**'
      - 'rust/portal-server/**'
      - 'rust/portal-client/**'
      # What the forwarding now rides on. `transport` dials with
      # `isekai_p2p::peer` and binds with `isekai-link-utils`, and nothing else
      # in CI compiles `portal-core` -- migration-spike.yml tests `camera-core`
      # and `isekai-p2p`, camera-apps.yml builds the two camera binaries. So
      # without these a breaking change to `peer::dial` or to the listener
      # helper leaves portal broken and green until someone happens to touch its
      # directory, which is the #144 hole this file exists to close with the
      # dependency edge moved one crate over.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/portal.yml'
  workflow_dispatch:

jobs:
  test:
    name: Forward a service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform's answer never hides another's, as migration-spike.yml
      # says for the same reason.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The integration tests stand up a real QUIC connection between the two
      # halves. They have hung this repository's CI before — see the header of
      # camera-core/tests/video_loopback.rs and the four ways portal-core's own
      # tests found — so the timeout above is the backstop, not the plan.
      - name: Test
        run: cargo test -p portal-core -- --nocapture
      # The binaries are not covered by the tests -- there is nothing to test
      # about them without a proxy -- so this is what says they still build.
      - name: Build the binaries
        run: cargo build -p portal-server -p portal-client

  compile:
    name: Compile (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # `--all-targets` so the test binaries compile too: a `cfg` that only
      # exists on one platform breaks at compile time, and that is the part
      # worth catching here. Running them is #155.
      - name: Check
        run: cargo check -p portal-core -p portal-server -p portal-client --all-targets

  # ------------------------------------------------------------------ Release
  #
  # **Only on a tag**, which is the opposite of what `camera-apps.yml` does, and
  # the reason is what each run costs. That workflow bundles on every push
  # because the camera apps take twenty minutes to build anyway; this one's
  # ordinary loop is a four-minute test job, and a release build on three
  # platforms — Windows compiling vendored OpenSSL among them — would be most of
  # a portal PR's CI for an artifact nobody looks at.
  #
  # What that costs is that a broken bundle is found at release time. Mitigated
  # rather than accepted: both halves of the bundling are `scripts/bundle-apps.*`
  # and `camera-apps.yml` runs them on every push, on all three platforms. What
  # is tag-only here is the app list, not the machinery.
  #
  # `workflow_dispatch` above is how to exercise it without cutting a tag.
  bundle:
    name: Bundle (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        if: runner.os == 'Windows'
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        run: cargo build --release -p portal-server -p portal-client
        working-directory: rust

      # `libmsquic` lives only inside cargo's build-script output, under a path
      # with a build hash in it, and nothing installs it. So a binary on its own
      # fails at startup with `error while loading shared libraries` — #167, and
      # what this exists to answer.
      - name: Bundle with the libraries (Linux, macOS)
        if: runner.os != 'Windows'
        run: scripts/bundle-apps.sh rust/target/release dist portal-${{ matrix.os }} portal-server portal-client

      - name: Bundle with the DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/bundle-apps.ps1 rust/target/release dist portal-${{ matrix.os }} portal-server portal-client

      - uses: actions/upload-artifact@v4
        with:
          name: portal-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portal-*
          path: artifacts

      # One archive per platform, so what is attached says which platform it
      # came from after it has been downloaded.
      - name: Package each platform
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release/$name.zip" .)
          done
          ls -l release

      # Attach to the release if there is one, create it if there is not — the
      # order the tag and the release arrive in depends on whether a person
      # pushed a tag or cut the release from the UI, and `camera-apps.yml`'s
      # header records what assuming one of them cost. `--clobber` so re-running
      # replaces what it uploaded last time.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" release/*.zip --clobber
