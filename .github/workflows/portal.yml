name: ISEKAI portal

# `portal-core` (docs/portal_plan.md phase 0) landed with nothing building it:
# migration-spike.yml tests `camera-core`, camera-apps.yml builds the two camera
# binaries, and the mobile workflows build the FFI crate. So the crate's green
# checks said nothing about the crate. This is #144.
#
# **All three platforms run the tests as of phase 1c-iii-b.** They did not
# before, and the reason is worth keeping because it is what changed rather than
# what was decided: running them needed `spike.rs`, which handed msquic a PEM and
# no PKCS#12. On Windows the credential path imports a PFX and its fallback goes
# through an RSA provider that cannot take rcgen's ECDSA P-256 key — so the
# listener could not start, and this file said Windows was "not asked to" run
# them rather than doing Windows-specific work on scaffolding phase 1 would
# delete.
#
# `transport.rs` replaced that scaffolding with `isekai_p2p::endpoint_cert`,
# which packages the bundle for exactly this reason — the same path
# `camera-core`'s video listener has taken on Windows all along, and which
# `video_loopback.rs` exercises there in migration-spike.yml. So the constraint
# is gone rather than worked around, and #152's "except portal-core on Windows"
# goes with it.
#
# The Windows job also builds vendored OpenSSL, which is what packaging that
# bundle costs. Making it optional was considered and rejected: with the feature
# off the bundle is silently `None`, msquic takes the RSA fallback again, and the
# failure moves from a slow CI job to `ASN1 bad tag value met` on a user's
# machine.

on:
  push:
    paths:
      - 'rust/portal-core/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/portal.yml'
  pull_request:
    paths:
      - 'rust/portal-core/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/portal.yml'
  workflow_dispatch:

jobs:
  test:
    name: Forward a TCP service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform's answer never hides another's, as migration-spike.yml
      # says for the same reason.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The integration tests stand up a real QUIC connection between the two
      # halves. They have hung this repository's CI before — see the header of
      # camera-core/tests/video_loopback.rs and the four ways portal-core's own
      # tests found — so the timeout above is the backstop, not the plan.
      #
      # `--all-targets` is not needed to compile the test binaries here: running
      # them does that, on every platform now.
      - name: Test
        run: cargo test -p portal-core
