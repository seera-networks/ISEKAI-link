name: ISEKAI portal

# `portal-core` (docs/portal_plan.md phase 0) landed with nothing building it:
# migration-spike.yml tests `camera-core`, camera-apps.yml builds the two camera
# binaries, and the mobile workflows build the FFI crate. So the crate's green
# checks said nothing about the crate. This is #144.
#
# **Linux and macOS run the tests; Windows compiles them**, and the Windows
# half is a known failure rather than a decision — see #155.
#
# It used to be a decision. Running them needed `spike.rs`, which handed msquic a
# PEM and no PKCS#12, and on Windows the credential path's no-PFX fallback goes
# through an RSA provider that cannot take rcgen's ECDSA P-256 key, so the
# listener could not start at all. Phase 1c-iii-b replaced that with
# `isekai_p2p::endpoint_cert`, which packages the bundle -- the same path
# `camera-core`'s video listener takes on Windows, exercised there by
# `video_loopback.rs`.
#
# That removed the reason, and macOS went from compiling the tests to running
# them. Windows did not: whichever of the two integration tests runs second has
# a dial that never completes, and raising its budget only lengthens the wait.
# #155 has the evidence. Until it is understood, asking Windows to run them
# would be asking for a red check that says nothing new.
#
# The Windows job also builds vendored OpenSSL, which is what packaging that
# bundle costs. Making it optional was considered and rejected: with the feature
# off the bundle is silently `None`, msquic takes the RSA fallback again, and the
# failure moves from a slow CI job to `ASN1 bad tag value met` on a user's
# machine.

on:
  push:
    paths:
      - 'rust/portal-core/**'
      # What the forwarding now rides on. `transport` dials with
      # `isekai_p2p::peer` and binds with `isekai-link-utils`, and nothing else
      # in CI compiles `portal-core` -- migration-spike.yml tests `camera-core`
      # and `isekai-p2p`, camera-apps.yml builds the two camera binaries. So
      # without these a breaking change to `peer::dial` or to the listener
      # helper leaves portal broken and green until someone happens to touch its
      # directory, which is the #144 hole this file exists to close with the
      # dependency edge moved one crate over.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/portal.yml'
  pull_request:
    paths:
      - 'rust/portal-core/**'
      # What the forwarding now rides on. `transport` dials with
      # `isekai_p2p::peer` and binds with `isekai-link-utils`, and nothing else
      # in CI compiles `portal-core` -- migration-spike.yml tests `camera-core`
      # and `isekai-p2p`, camera-apps.yml builds the two camera binaries. So
      # without these a breaking change to `peer::dial` or to the listener
      # helper leaves portal broken and green until someone happens to touch its
      # directory, which is the #144 hole this file exists to close with the
      # dependency edge moved one crate over.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/portal.yml'
  workflow_dispatch:

jobs:
  test:
    name: Forward a TCP service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform's answer never hides another's, as migration-spike.yml
      # says for the same reason.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The integration tests stand up a real QUIC connection between the two
      # halves. They have hung this repository's CI before — see the header of
      # camera-core/tests/video_loopback.rs and the four ways portal-core's own
      # tests found — so the timeout above is the backstop, not the plan.
      - name: Test
        run: cargo test -p portal-core

  compile:
    name: Compile (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # `--all-targets` so the test binaries compile too: a `cfg` that only
      # exists on one platform breaks at compile time, and that is the part
      # worth catching here. Running them is #155.
      - name: Check
        run: cargo check -p portal-core --all-targets
