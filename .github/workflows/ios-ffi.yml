name: iOS client FFI

# docs/ios_camera_client_plan.md, Phases 0-2: build the `isekai-client-ffi`
# viewer crate for Apple platforms and the SwiftUI app on top of it. Neither can
# be built locally — they need a macOS runner with Xcode and the iOS SDK.
#
# The `apple-native` job proves the whole toolchain (msquic + the Rust core +
# UniFFI) builds and links on macOS and publishes the Swift bindings. The
# `ios-app` job runs ios/build-rust.sh, which cross-compiles both iOS targets and
# assembles the xcframework, then generates the Xcode project and builds the app
# for the simulator. The *-apple-ios cross-compile support they rely on lives in
# the msquic submodule (seera-msquic scripts/build.rs + submodules/CMakeLists.txt),
# and the deployment target both halves link against is pinned in
# rust/.cargo/config.toml.

on:
  push:
    paths:
      - 'rust/isekai-client-ffi/**'
      - 'rust/camera-core/**'
      - 'rust/Cargo.toml'
      - 'rust/.cargo/config.toml'
      - 'ios/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/ios-ffi.yml'
  pull_request:
    paths:
      - 'rust/isekai-client-ffi/**'
      - 'rust/camera-core/**'
      - 'rust/Cargo.toml'
      - 'rust/.cargo/config.toml'
      - 'ios/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/ios-ffi.yml'
  workflow_dispatch:

jobs:
  apple-native:
    name: Build FFI + Swift bindings (macOS native)
    runs-on: macos-14
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isekai-client-ffi (host macOS)
        run: cargo build -p isekai-client-ffi
      - name: Generate Swift bindings from the built library
        run: |
          set -euo pipefail
          LIB=$(ls target/debug/libisekai_client_ffi.dylib)
          ./target/debug/uniffi-bindgen generate \
            --library "$LIB" --language swift --out-dir target/swift-bindings
          ls -l target/swift-bindings
      - uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: rust/target/swift-bindings/

  ios-app:
    name: Build iOS app (device slices + simulator build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the Rust bindings and xcframework
        run: ./build-rust.sh
        working-directory: ios
      - name: Generate the Xcode project
        run: xcodegen generate
        working-directory: ios
      # Only the arm64 simulator slice is built, so pin ARCHS rather than let
      # the generic destination also ask for x86_64.
      - name: Build the app for the simulator
        run: |
          xcodebuild build \
            -project IsekaiCameraClient.xcodeproj \
            -scheme IsekaiCameraClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: IsekaiCameraClient-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/IsekaiCameraClient.app
