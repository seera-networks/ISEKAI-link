name: iOS client FFI

# docs/ios_camera_client_plan.md, Phases 0-2: build the `isekai-client-ffi`
# viewer crate for Apple platforms and the SwiftUI app on top of it. Neither can
# be built locally — they need a macOS runner with Xcode and the iOS SDK.
#
# The `apple-native` job proves the whole toolchain (msquic + the Rust core +
# UniFFI) builds and links on macOS and publishes the Swift bindings. The
# `ios-app` job runs ios/build-rust.sh, which cross-compiles both iOS targets and
# assembles the xcframework, then generates the Xcode project and builds the app
# for the simulator. The *-apple-ios cross-compile support they rely on lives in
# the msquic submodule (seera-msquic scripts/build.rs + submodules/CMakeLists.txt),
# and the deployment target both halves link against is pinned in
# .cargo/config.toml.

on:
  push:
    paths:
      - 'rust/isekai-client-ffi/**'
      - 'rust/camera-core/**'
      # The layer the FFI reaches through. 550 lines of certificate handling --
      # `cfg(windows)` branches, `rcgen`, the PKCS#12 packaging -- moved out of
      # `camera-core` into these in phase 1c-iii-a, so watching only
      # `camera-core` would leave a broken cross-compile green until someone
      # happened to touch it. Same hole #144 is about, with the code moved.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      # And the rest of the FFI's graph, which stops one edge short otherwise:
      # `isekai-link-utils` pulls `channel-masque`, and it and `isekai-p2p-core`
      # pull `h3-util` from `submodules/tonic-h3`. `Cargo.lock` because a
      # transitive crate that will not cross-compile for the NDK usually arrives
      # as a lockfile-only `cargo update`.
      - 'rust/channel-masque/**'
      - 'rust/Cargo.lock'
      - 'submodules/tonic-h3'
      - 'rust/Cargo.toml'
      - '.cargo/config.toml'
      - 'ios/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/ios-ffi.yml'
  pull_request:
    paths:
      - 'rust/isekai-client-ffi/**'
      - 'rust/camera-core/**'
      # The layer the FFI reaches through. 550 lines of certificate handling --
      # `cfg(windows)` branches, `rcgen`, the PKCS#12 packaging -- moved out of
      # `camera-core` into these in phase 1c-iii-a, so watching only
      # `camera-core` would leave a broken cross-compile green until someone
      # happened to touch it. Same hole #144 is about, with the code moved.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      # And the rest of the FFI's graph, which stops one edge short otherwise:
      # `isekai-link-utils` pulls `channel-masque`, and it and `isekai-p2p-core`
      # pull `h3-util` from `submodules/tonic-h3`. `Cargo.lock` because a
      # transitive crate that will not cross-compile for the NDK usually arrives
      # as a lockfile-only `cargo update`.
      - 'rust/channel-masque/**'
      - 'rust/Cargo.lock'
      - 'submodules/tonic-h3'
      - 'rust/Cargo.toml'
      - '.cargo/config.toml'
      - 'ios/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/ios-ffi.yml'
  workflow_dispatch:

jobs:
  apple-native:
    name: Build FFI + Swift bindings (macOS native)
    runs-on: macos-14
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/submodules
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls ${{ runner.os == 'Windows' && 'schannel' || 'quictls' }} -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isekai-client-ffi (host macOS)
        run: cargo build -p isekai-client-ffi
      - name: Generate Swift bindings from the built library
        run: |
          set -euo pipefail
          LIB=$(ls target/debug/libisekai_client_ffi.dylib)
          ./target/debug/uniffi-bindgen generate \
            --library "$LIB" --language swift --out-dir target/swift-bindings
          ls -l target/swift-bindings
      - uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: rust/target/swift-bindings/

  ios-app:
    name: Build iOS app + relay integration test
    runs-on: macos-14
    env:
      # An Auth0 access token for the live Identity/Proxy. Absent (forks, or
      # before anyone sets it) the integration test is skipped and the job stays
      # a build check. Access tokens expire, so this needs periodic refreshing —
      # minting one from machine-to-machine credentials would be the durable fix.
      AUTH0_TOKEN: ${{ secrets.ISEKAI_TEST_AUTH0_TOKEN }}
      # The synthetic server's Endpoint key, pinned rather than generated per
      # run. The proxy issues a per-Endpoint relay certificate through ACME and
      # caches it by Endpoint ID, so a fresh key every run means a fresh
      # Let's Encrypt certificate — against a limit of 50 per week for the whole
      # isekai.tools domain. Both secrets are required for the test to run, so a
      # half-configured repository cannot quietly burn that budget.
      ENDPOINT_KEY_PEM: ${{ secrets.ISEKAI_TEST_ENDPOINT_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/submodules
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls ${{ runner.os == 'Windows' && 'schannel' || 'quictls' }} -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the Rust bindings and xcframework
        run: ./build-rust.sh
        working-directory: ios
      - name: Generate the Xcode project
        run: xcodegen generate
        working-directory: ios
      # Only the arm64 simulator slice is built, so pin ARCHS rather than let
      # the generic destination also ask for x86_64.
      - name: Build the app for the simulator
        run: |
          xcodebuild build \
            -project IsekaiCameraClient.xcodeproj \
            -scheme IsekaiCameraClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ios

      # Phases 0 and 1 of the plan: a frame actually crossing the relay into iOS
      # code. The peer is camera-core's synthetic_server — no camera, no OpenCV
      # — and the simulator reaches the host's loopback control socket directly.
      - name: Pin the synthetic server's Endpoint key
        if: env.AUTH0_TOKEN != '' && env.ENDPOINT_KEY_PEM != ''
        run: |
          set -euo pipefail
          # KEY_PATH's default, relative to this working directory. Reusing the
          # same Endpoint ID every run means the proxy serves its cached relay
          # certificate instead of ordering a new one.
          printf '%s\n' "$ENDPOINT_KEY_PEM" > synthetic-server-endpoint.pem
          chmod 600 synthetic-server-endpoint.pem
        working-directory: rust

      - name: Start the synthetic camera server
        if: env.AUTH0_TOKEN != '' && env.ENDPOINT_KEY_PEM != ''
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/synthetic-server.log"
          cargo run -p camera-core --example synthetic_server -- \
            --control 127.0.0.1:57345 > "$LOG" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/synthetic-server.pid"
          for _ in $(seq 1 180); do
            if grep -q '^ready$' "$LOG"; then
              exit 0
            fi
            sleep 1
          done
          echo "synthetic_server never reported ready:"
          cat "$LOG"
          exit 1
        working-directory: rust

      - name: Run the viewer integration test in the simulator
        if: env.AUTH0_TOKEN != '' && env.ENDPOINT_KEY_PEM != ''
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in runtimes[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator")')
          echo "using simulator $UDID"
          xcodebuild test \
            -project IsekaiCameraClient.xcodeproj \
            -scheme IsekaiCameraClient \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ios

      - name: Stop the synthetic camera server
        if: always() && env.AUTH0_TOKEN != '' && env.ENDPOINT_KEY_PEM != ''
        run: |
          PID_FILE="$RUNNER_TEMP/synthetic-server.pid"
          if [ -f "$PID_FILE" ]; then
            kill "$(cat "$PID_FILE")" 2>/dev/null || true
          fi
          # stdout carries the ids and readiness only; the Auth0 token is handed
          # out over the control socket, never printed.
          echo '--- synthetic_server ---'
          cat "$RUNNER_TEMP/synthetic-server.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: IsekaiCameraClient-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/IsekaiCameraClient.app

  # A device build to sideload, since there is no Mac in this loop. Unsigned:
  # Sideloadly or AltStore re-signs it with whatever Apple ID installs it, and a
  # free one is enough for testing. Release throughout — a debug Rust core means
  # unoptimised msquic and crypto, which is not what you want to judge a live
  # video path on.
  #
  # 25 minutes of macOS runner for an artifact nobody needs on every push, so it
  # is on demand and on main rather than on every branch.
  ios-ipa:
    name: Package an unsigned device .ipa
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/submodules
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls ${{ runner.os == 'Windows' && 'schannel' || 'quictls' }} -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the Rust bindings and xcframework (release)
        run: ./build-rust.sh --release
        working-directory: ios
      - name: Generate the Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Build the app for a device
        run: |
          xcodebuild build \
            -project IsekaiCameraClient.xcodeproj \
            -scheme IsekaiCameraClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
        working-directory: ios
      # An .ipa is just a zip with the bundle under Payload/.
      - name: Package the .ipa
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release-iphoneos/IsekaiCameraClient.app"
          test -d "$APP"
          file "$APP/IsekaiCameraClient"
          rm -rf Payload IsekaiCameraClient-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry IsekaiCameraClient-unsigned.ipa Payload
          ls -lh IsekaiCameraClient-unsigned.ipa
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: IsekaiCameraClient-unsigned-ipa
          path: ios/IsekaiCameraClient-unsigned.ipa
