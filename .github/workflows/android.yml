name: Android client

# The Android viewer and the Rust core underneath it. Neither half is built by
# any other job: `camera-apps.yml` builds the desktop apps and `ios-ffi.yml` the
# Apple ones, so without this the first thing to notice a broken Android build
# is a person.
#
# Three jobs, split by what they need. `bindings` needs only a host toolchain
# and proves the Kotlin bindings still generate from the Rust interface — the
# check that replaces having them committed. `app` adds the NDK, cross-compiles
# the core and assembles the APK, and is the slower half. `portal-app` does the
# same for the second Android client.
#
# **`android-portal` reached `main` with nothing in CI building it at all.**
# The paths below listed `android/**` and the camera FFI's crates only, so a
# pull request adding a whole second Android app ran these jobs — against the
# camera app — and went green. What that hid: a `cacert.pem` the app opens at
# startup was never committed (`.gitignore`'s `*.pem` with a per-app exception
# that did not name it), so every build from a clean checkout could not
# complete a single TLS handshake. #288 added a tree-level check for the file
# and this job for the rest.

on:
  push:
    paths:
      - 'rust/isekai-client-ffi/**'
      - 'rust/camera-core/**'
      # The layer the FFI reaches through. 550 lines of certificate handling --
      # `cfg(windows)` branches, `rcgen`, the PKCS#12 packaging -- moved out of
      # `camera-core` into these in phase 1c-iii-a, so watching only
      # `camera-core` would leave a broken cross-compile green until someone
      # happened to touch it. Same hole #144 is about, with the code moved.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      # And the rest of the FFI's graph, which stops one edge short otherwise:
      # `isekai-link-utils` pulls `channel-masque`, and it and `isekai-p2p-core`
      # pull `h3-util` from `submodules/tonic-h3`. `Cargo.lock` because a
      # transitive crate that will not cross-compile for the NDK usually arrives
      # as a lockfile-only `cargo update`.
      - 'rust/channel-masque/**'
      - 'rust/Cargo.lock'
      - 'submodules/tonic-h3'
      - 'rust/Cargo.toml'
      - '.cargo/config.toml'
      - 'android/**'
      # The second Android client and the crates only it pulls in. `portal-core`
      # and `portal-client-ffi` are not in the camera app's graph, and
      # `portal-client-ffi` is its own workspace with its own lockfile, so
      # `cargo check --workspace` never builds it either.
      - 'android-portal/**'
      - 'rust/portal-core/**'
      - 'rust/portal-client-ffi/**'
      # `isekai-privacy`, which **both** apps reach -- `portal-core` and
      # `camera-core` each depend on it -- and which this list missed in both
      # directions until it was resolved against the FFI's actual closure
      # rather than read off the imports. A change confined to it still runs
      # `camera-apps.yml` and `mutants.yml`, whose filters are a plain
      # `rust/**`, so it is not unwatched; what it does not run is either
      # cross-compile, which is where a dependency that will not build for the
      # NDK shows up and nowhere else.
      - 'rust/privacy/**'
      - 'submodules/msquic-async-rs'
      # **The composite action these steps call.** `submodules` decides what a
      # job fetches, and it was not watched, so a change to it would have run
      # no workflow that uses it. The same hole as `scripts/**` and for the
      # same reason: a path filter has to cover the inputs, not just the file
      # it is written in. (This workflow caches no cargo build at all, so
      # `rust-cache` is not among its inputs.)
      - '.github/actions/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'rust/isekai-client-ffi/**'
      - 'rust/camera-core/**'
      # The layer the FFI reaches through. 550 lines of certificate handling --
      # `cfg(windows)` branches, `rcgen`, the PKCS#12 packaging -- moved out of
      # `camera-core` into these in phase 1c-iii-a, so watching only
      # `camera-core` would leave a broken cross-compile green until someone
      # happened to touch it. Same hole #144 is about, with the code moved.
      - 'rust/isekai-p2p/**'
      - 'rust/isekai-p2p-core/**'
      - 'rust/utils/**'
      # And the rest of the FFI's graph, which stops one edge short otherwise:
      # `isekai-link-utils` pulls `channel-masque`, and it and `isekai-p2p-core`
      # pull `h3-util` from `submodules/tonic-h3`. `Cargo.lock` because a
      # transitive crate that will not cross-compile for the NDK usually arrives
      # as a lockfile-only `cargo update`.
      - 'rust/channel-masque/**'
      - 'rust/Cargo.lock'
      - 'submodules/tonic-h3'
      - 'rust/Cargo.toml'
      - '.cargo/config.toml'
      - 'android/**'
      # The second Android client and the crates only it pulls in. `portal-core`
      # and `portal-client-ffi` are not in the camera app's graph, and
      # `portal-client-ffi` is its own workspace with its own lockfile, so
      # `cargo check --workspace` never builds it either.
      - 'android-portal/**'
      - 'rust/portal-core/**'
      - 'rust/portal-client-ffi/**'
      # `isekai-privacy`, which **both** apps reach -- `portal-core` and
      # `camera-core` each depend on it -- and which this list missed in both
      # directions until it was resolved against the FFI's actual closure
      # rather than read off the imports. A change confined to it still runs
      # `camera-apps.yml` and `mutants.yml`, whose filters are a plain
      # `rust/**`, so it is not unwatched; what it does not run is either
      # cross-compile, which is where a dependency that will not build for the
      # NDK shows up and nowhere else.
      - 'rust/privacy/**'
      - 'submodules/msquic-async-rs'
      # **The composite action these steps call.** `submodules` decides what a
      # job fetches, and it was not watched, so a change to it would have run
      # no workflow that uses it. The same hole as `scripts/**` and for the
      # same reason: a path filter has to cover the inputs, not just the file
      # it is written in. (This workflow caches no cargo build at all, so
      # `rust-cache` is not among its inputs.)
      - '.github/actions/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  bindings:
    name: Generate the Kotlin bindings
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/submodules
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls ${{ runner.os == 'Windows' && 'schannel' || 'quictls' }} -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isekai-client-ffi (host)
        run: cargo build -p isekai-client-ffi
      # The same shape as the Swift half in ios-ffi.yml: the interface is read
      # out of a built library, so what is published cannot disagree with what
      # the crate exposes.
      - name: Generate the bindings from the built library
        run: |
          set -euo pipefail
          LIB=$(ls target/debug/libisekai_client_ffi.so)
          ./target/debug/uniffi-bindgen generate \
            --library "$LIB" --language kotlin --out-dir target/kotlin-bindings
          ls -R target/kotlin-bindings
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-bindings
          path: rust/target/kotlin-bindings/

  app:
    name: Build the app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/submodules
      # **New here, and it was being got for free.** This job cross-compiles
      # the core, which configures quictls (see the NDK note below) — and the
      # sources for that used to arrive because the checkout was recursive.
      # With the fetch narrowed to what `docs/Build.md` names, the MsQuic
      # submodules are this script's job, exactly as in `bindings` above.
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls ${{ runner.os == 'Windows' && 'schannel' || 'quictls' }} -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # **v4 because v3's default package list asks for `tools`**, which Google
      # has removed from the SDK repository -- `sdkmanager` answers "Failed to
      # find package 'tools'" and the action exits 1 before any of this builds.
      # It is a clock-driven break rather than a change-driven one: the last
      # green run here was 2026-09-07 and nothing in the workflow moved. v4's
      # default is `platform-tools` alone, which is what this needs.
      - uses: android-actions/setup-android@v4
      # Deliberately not installing one: the runner ships an NDK and points
      # ANDROID_NDK_ROOT at it, so adding a second leaves cargo-ndk compiling
      # with one while quictls configures against the other -- which it says
      # out loud and then fails obscurely. The API level the build rests on is
      # `ANDROID_PLATFORM=android-29` in seera-msquic's build script, not the
      # NDK version.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # No `env:` mapping for the NDK on purpose. The `env` context only holds
      # what a workflow defines, so `${{ env.ANDROID_NDK_ROOT }}` is empty and
      # sets ANDROID_NDK_HOME to nothing — which cargo-ndk reports as "Error
      # detecting NDK version for path ". The runner exports ANDROID_NDK_ROOT
      # into the process environment, where cargo-ndk and seera-msquic's build
      # script both find it.
      - name: Cross-compile the core
        run: ./gradlew --no-daemon :app:generateJniLibs
        working-directory: android
      # Assembling runs `generateUniFfiBindings` on the way, so a Kotlin file
      # that no longer matches the Rust interface fails here rather than on a
      # phone.
      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: IsekaiCameraClient-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  portal-app:
    name: Build the portal app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/submodules
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls ${{ runner.os == 'Windows' && 'schannel' || 'quictls' }} -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      # **This job does install an NDK, unlike `app` above, and for the reason
      # that one gives for not installing one.** The hazard there is two NDKs,
      # with cargo-ndk compiling against one while quictls configures against
      # the other. `android-portal` pins `ndkVersion = 29.0.14206865` -- it has
      # to, or AGP has no `llvm-strip` and packages a ~200MB unstripped `.so`
      # -- so AGP will use that one whatever the runner ships. Installing it
      # and pointing both NDK variables at it is what makes the two halves
      # agree; leaving the runner's default in place is what would split them.
      - name: Install the NDK this app pins
        run: |
          ndk=$(sed -nE 's/.*ndkVersion = "([^"]+)".*/\1/p' android-portal/app/build.gradle.kts)
          test -n "$ndk" || { echo "::error::no ndkVersion in android-portal/app/build.gradle.kts"; exit 1; }
          echo "pinned NDK: $ndk"
          # No --channel: 29.0.14206865 is the stable r29, and sdkmanager's
          # default channel has it. The r29 rc builds are the *lower* version
          # numbers (…13113456 rc1 through …14033849 rc4), so a glance at the
          # number is misleading -- checked against `sdkmanager --list`.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          # Both names, because the readers do not split the way it is
          # tempting to write down. seera-msquic's build script tries
          # ANDROID_NDK_HOME, then ANDROID_NDK_ROOT, then
          # ANDROID_NDK_LATEST_HOME (`scripts/build.rs`), cargo-ndk reads
          # ANDROID_NDK_HOME, and AGP reads neither -- it resolves the pinned
          # `ndkVersion` under $ANDROID_HOME/ndk. Setting both to the same
          # path is what makes that agree; neither is redundant.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # `arm64-v8a` only, which is what `portalAbis` defaults to and what a
      # phone needs. The x86_64 an emulator wants is a `-PportalAbis` away and
      # doubles a full native build of msquic and quictls, which is not worth
      # paying for on every push.
      - name: Cross-compile the core
        run: ./gradlew --no-daemon :app:generateJniLibs
        working-directory: android-portal
      # Assembling runs `generateUniFfiBindings` on the way, so a Kotlin file
      # that no longer matches the Rust interface fails here rather than on a
      # phone.
      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android-portal
      - uses: actions/upload-artifact@v4
        with:
          name: IsekaiPortalClient-debug-apk
          path: android-portal/app/build/outputs/apk/debug/*.apk
