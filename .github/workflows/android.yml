name: Android client

# The Android viewer and the Rust core underneath it. Neither half is built by
# any other job: `camera-apps.yml` builds the desktop apps and `ios-ffi.yml` the
# Apple ones, so without this the first thing to notice a broken Android build
# is a person.
#
# One job for now. `bindings` needs only a host toolchain and proves the Kotlin
# bindings still generate from the Rust interface — the check that replaces
# having them committed. Building the app itself needs the cross-compile, and
# the note at the bottom says what stands in the way of that.

on:
  push:
    paths:
      - 'rust/isekai-client-ffi/**'
      - 'rust/camera-core/**'
      - 'rust/Cargo.toml'
      - '.cargo/config.toml'
      - 'android/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'rust/isekai-client-ffi/**'
      - 'rust/camera-core/**'
      - 'rust/Cargo.toml'
      - '.cargo/config.toml'
      - 'android/**'
      - 'submodules/msquic-async-rs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  bindings:
    name: Generate the Kotlin bindings
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare machine for seera-msquic
        run: scripts/prepare-machine.ps1 -Tls openssl -ForBuild
        shell: pwsh
        working-directory: submodules/msquic-async-rs/seera-msquic
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isekai-client-ffi (host)
        run: cargo build -p isekai-client-ffi
      # The same shape as the Swift half in ios-ffi.yml: the interface is read
      # out of a built library, so what is published cannot disagree with what
      # the crate exposes.
      - name: Generate the bindings from the built library
        run: |
          set -euo pipefail
          LIB=$(ls target/debug/libisekai_client_ffi.so)
          ./target/debug/uniffi-bindgen generate \
            --library "$LIB" --language kotlin --out-dir target/kotlin-bindings
          ls -R target/kotlin-bindings
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-bindings
          path: rust/target/kotlin-bindings/

# The app itself is not built here yet, and the reason is one missing block in
# the msquic submodule rather than anything in `android/`.
#
# `seera-msquic/scripts/build.rs` has an iOS branch that hands CMake the
# ios-cmake toolchain file and a `PLATFORM`; there is no Android counterpart. So
# for `aarch64-linux-android`, cmake-rs sets `CMAKE_SYSTEM_NAME=Android` — which
# makes CMake's `ANDROID` true — while nothing sets `ANDROID_ABI`, and
# `submodules/CMakeLists.txt:219` stops with "Unknown android abi type". No
# amount of environment on this side reaches it: the value has to arrive as a
# `-D`, which only that build script is in a position to pass.
#
# Adding the block (toolchain file + `ANDROID_ABI` + `ANDROID_PLATFORM`, the
# same shape as the iOS one) is a change to the submodule and a bump here.
# `app/build.gradle.kts`'s `generateJniLibs` is the invocation it will need, and
# the local recipe this port was built with does exist — it is in a setup note
# on the author's machine rather than in the repository.
#
# A job that cannot go green is worse than no job, so this waits.
