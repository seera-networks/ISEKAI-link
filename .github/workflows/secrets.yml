name: Secrets

# Refuse a private key anywhere in the tree.
#
# **The pre-commit hook is the fast half and this is the half that counts.**
# Hooks are per-clone (`git config core.hooksPath .githooks`), so a fresh
# checkout has none, and `--no-verify` skips the one that is installed. Neither
# applies here.
#
# It scans the whole tree rather than the diff: a key that arrived before this
# job existed is worth finding once, and a scan of a repository this size costs
# seconds.
#
# What counts as a key is a `BEGIN … PRIVATE KEY` line followed by a base64
# body. The line alone is not enough -- `isekai-p2p/src/endpoint_cert.rs` writes
# one into a test file to check that a truncated key is an error rather than a
# fresh start, and that test is worth keeping.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  keys:
    name: No private keys in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        # Submodules deliberately not checked out: msquic-async-rs ships example
        # certificates with their keys, which are public, upstream's, and not
        # this repository's to remove.
      - name: Scan
        run: |
          # Submodule paths are gitlinks, not files; awk would warn on each.
          submodules=$(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}')
          found=$(git ls-files | grep -vxF "$submodules" | tr '\n' '\0' | xargs -0 -r awk '
              FNR == 1 { seen = 0 }
              /-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----/ { seen = 1; next }
              seen && /^[A-Za-z0-9+\/=]{40,}$/ { print FILENAME; nextfile }
              { seen = 0 }
          ' | sort -u)
          if [ -n "$found" ]; then
              echo "::error::a private key is committed to this repository"
              echo "$found" | sed 's/^/  /'
              exit 1
          fi
          echo "no private keys in the tree"
