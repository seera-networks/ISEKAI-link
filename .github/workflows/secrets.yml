name: Secrets

# What the `*.pem` block in `.gitignore` keeps out, and the one thing it has to
# let in. Two jobs, opposite directions, same subject -- and no path filter on
# either, because a rule about what the committed tree contains is worth
# nothing if a pull request can be shaped so it does not run.
#
# Refuse a private key anywhere in the tree.
#
# **The pre-commit hook is the fast half and this is the half that counts.**
# Hooks are per-clone (`git config core.hooksPath .githooks`), so a fresh
# checkout has none, and `--no-verify` skips the one that is installed. Neither
# applies here.
#
# It scans the whole tree rather than the diff: a key that arrived before this
# job existed is worth finding once, and a scan of a repository this size costs
# seconds.
#
# What counts as a key is a `BEGIN … PRIVATE KEY` line followed by a base64
# body. The line alone is not enough -- `isekai-p2p/src/endpoint_cert.rs` writes
# one into a test file to check that a truncated key is an error rather than a
# fresh start, and that test is worth keeping.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  keys:
    name: No private keys in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        # Submodules deliberately not checked out: msquic-async-rs ships example
        # certificates with their keys, which are public, upstream's, and not
        # this repository's to remove.
      - name: Scan
        run: |
          # Submodule paths are gitlinks, not files; awk would warn on each.
          submodules=$(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}')
          found=$(git ls-files | grep -vxF "$submodules" | tr '\n' '\0' | xargs -0 -r awk '
              FNR == 1 { seen = 0 }
              /-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----/ { seen = 1; next }
              seen && /^[A-Za-z0-9+\/=]{40,}$/ { print FILENAME; nextfile }
              { seen = 0 }
          ' | sort -u)
          if [ -n "$found" ]; then
              echo "::error::a private key is committed to this repository"
              echo "$found" | sed 's/^/  /'
              exit 1
          fi
          echo "no private keys in the tree"

  assets:
    name: Every asset an app opens is in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check
        # **The other half of `*.pem`.** That rule ignores every PEM and the
        # block carries one exception per app for the CA bundle each Android
        # app ships. `android-portal`'s was missing, so the author's own
        # `cacert.pem` was ignored, never committed, and the app reached `main`
        # unable to complete a single TLS handshake: no `SSL_CERT_FILE`, no
        # roots for quictls, every connection dead as "connection lost" before
        # pairing could even be tried.
        #
        # **Nothing else could have caught it.** A build-time check passes on
        # the machine that has the file -- which is exactly the machine the
        # app was built on. `android.yml` is path-filtered and does not watch
        # `android-portal/**` at all. The app's own code logs the failure and
        # carries on, by design, so it does not crash either. The only place
        # the file is missing is the committed tree, so that is what to look
        # at.
        #
        # Literal names only. `assets.open(someVariable)` is not checked and is
        # not meant to be: the point is the file somebody meant to commit.
        #
        # Both spellings and both overloads, because a guard that misses the
        # form somebody happens to write is worse than none -- it reads green
        # over the thing it exists to catch. Kotlin's `assets.open(…)`, Java's
        # `getAssets().open(…)`, and the two-argument
        # `open("cacert.pem", AssetManager.ACCESS_STREAMING)`.
        #
        # The asset may sit in any of the module's source sets, not just the
        # one the caller is in: AGP merges them, so a `src/debug` caller
        # reading a `src/main` asset is correct and a `src/main` caller may be
        # served by a `src/debug` override.
        run: |
          missing=$(
            for src in $(git ls-files '*.kt' '*.java'); do
                case "$src" in */src/*) ;; *) continue ;; esac
                module=${src%%/src/*}
                grep -oE '[aA]ssets(\(\))?\.open\("[^"]+"' "$src" |
                    sed -E 's/.*\("([^"]+)"/\1/' |
                    while read -r name; do
                        set -- $(git ls-files "$module/src/*/assets/$name")
                        [ "$#" -gt 0 ] ||
                            echo "  $module/src/*/assets/$name -- opened by $src"
                    done
            done | sort -u
          )
          if [ -n "$missing" ]; then
              echo "::error::an app opens an asset that is not in the tree"
              echo "$missing"
              echo
              echo "If it is ignored on purpose, add the exception to .gitignore."
              exit 1
          fi
          echo "every asset opened by name is committed"
