# rustc defaults `*-apple-ios` to a minimum of iOS 10.0, while msquic/quictls
# are compiled for the 13.0 that seera-msquic's build.rs (and its build.ps1)
# uses. Linking below the version the objects were built for leaves
# libSystem-versioned symbols such as `___chkstk_darwin` (iOS 12+) undefined, so
# pin both sides here: seera-msquic's build.rs reads this same variable.
#
# `[env]` does not override a value already present in the environment, so an
# Xcode-driven build can still choose its own deployment target.
#
# This lives at the repo root rather than next to the workspace in rust/ because
# cargo discovers config from the *working directory* upwards, not from
# --manifest-path: ios/build-rust.sh and any future Xcode run-script phase
# invoke cargo from outside rust/.
[env]
IPHONEOS_DEPLOYMENT_TARGET = "13.0"
