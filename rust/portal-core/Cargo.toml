[package]
name = "portal-core"
version.workspace = true
edition = "2021"

# Phase 0 of docs/portal_plan.md. TCP only, one service, no config, no UI.
[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
msquic-async = { workspace = true }
# Standing up the listener: the credential loading and its Windows PKCS#12
# branch (`transport::bind`). The *client* configuration came out of
# `camera-core` into `isekai-p2p` in phase 1b and is used from there.
isekai-link-utils = { workspace = true }
# The connection layer `transport` dials with, and the certificate it presents
# (`isekai_p2p::peer`, `isekai_p2p::endpoint_cert`). A plain dependency since
# phase 1c-iii-b: the forwarding's own transport is this, not scaffolding
# behind a feature.
isekai-p2p = { workspace = true }
tokio-util = { workspace = true }
# Reading the `expires_at` the proxy puts on a grant (`grant`).
time = { workspace = true }
# The service catalogue's file (`config`). What may be reached is the one thing
# this crate must not let the caller decide, so where it is written down and how
# it is parsed are part of the security story -- see plan 4.3.
serde = { workspace = true }
toml = { workspace = true }
# The datagram payloads UDP forwarding carries (`datagram`). Also what
# msquic-async's datagram API takes and returns.
bytes = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
