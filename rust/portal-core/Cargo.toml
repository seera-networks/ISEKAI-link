[package]
name = "portal-core"
version = "0.1.0"
edition = "2021"

# Phase 0 of docs/portal_plan.md. TCP only, one service, no config, no UI.
[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
msquic-async = { workspace = true }
# Standing up the listener: the credential loading and its Windows PKCS#12
# branch (`transport::bind`). The *client* configuration came out of
# `camera-core` into `isekai-p2p` in phase 1b and is used from there.
isekai-link-utils = { workspace = true }
# The connection layer `transport` dials with, and the certificate it presents
# (`isekai_p2p::peer`, `isekai_p2p::endpoint_cert`). A plain dependency since
# phase 1c-iii-b: the forwarding's own transport is this, not scaffolding
# behind a feature.
isekai-p2p = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
