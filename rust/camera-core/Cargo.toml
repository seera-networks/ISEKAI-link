[package]
name = "camera-core"
version = "0.1.0"
edition = "2021"

# The camera apps' video transport and P2P wiring, free of OpenCV / egui so it
# builds and tests on its own. The GUIs (`camera-server`, `camera-client`) do
# capture + rendering and call into here.
[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
msquic-async = { workspace = true }
isekai-link-utils = { workspace = true }
isekai-p2p = { workspace = true }
# Dev self-signed certificate for the video ("sample" ALPN) QUIC listener.
rcgen = { workspace = true }
# The video TLS key's SPKI digest, compared against what the proxy reports, and
# the PKCS#12 blob Windows loads credentials from (`tls`).
base64 = { workspace = true }
sha2 = { workspace = true }
# The privacy policy and the record of agreeing to it (`privacy`).
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

# Windows only, and only to package that dev certificate as PKCS#12: msquic's
# Windows credential path imports a PFX blob, and its no-PFX fallback goes
# through an RSA provider that cannot take rcgen's ECDSA P-256 key (see
# src/tls.rs). Vendored so the build does not depend on an OpenSSL installed on
# the machine. Off Windows the PEM path is used and OpenSSL is never linked —
# which is the point of confining this to a target-specific dependency.
[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10.66", features = ["vendored"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
# Only the synthetic_server example needs it; keeping it a dev-dependency keeps
# it out of anything that ships.
jpeg-encoder = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }
# The migration_spike example writes the dev certificate out for msquic's
# file-based credential loader.
tempfile = { workspace = true }
