[package]
name = "camera-core"
version.workspace = true
edition = "2021"

# The camera apps' video transport and P2P wiring, free of OpenCV / egui so it
# builds and tests on its own. The GUIs (`camera-server`, `camera-client`) do
# capture + rendering and call into here.
[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
msquic-async = { workspace = true }
isekai-link-utils = { workspace = true }
isekai-p2p = { workspace = true }
# The privacy policy and the record of agreeing to it (`privacy`).
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Building a throwaway CA for the certificate-name test.
rcgen = { workspace = true }
bytes = { workspace = true }
msquic-async = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
# Only the synthetic_server example needs it; keeping it a dev-dependency keeps
# it out of anything that ships.
jpeg-encoder = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }
# The migration_spike example writes the dev certificate out for msquic's
# file-based credential loader.
tempfile = { workspace = true }
