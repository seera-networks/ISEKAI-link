[package]
name = "isekai-link-utils"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
channel-masque = { workspace = true }
# `cert` re-exports the certificate digest from there: everything that consumes
# it sits below this crate, so it owns it. Default features -- no msquic.
isekai-p2p-core = { workspace = true }
# The managed-domain certificate route (`cert`) generates the key that stays
# here. Everything else it used to do went down to `isekai-p2p-core` in phases
# 1c-i and 1c-iii-a -- digesting a key or a certificate, and building the CSR --
# and `x509-parser` and `sha2` went with it. `base64` stays for the PEM and JWT
# handling elsewhere in the crate.
rcgen = { workspace = true }
base64 = { workspace = true }
h3-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true, features = ["channel"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
schannel = { workspace = true }
windows = { workspace = true, features = ["Win32_Security_Cryptography"]}