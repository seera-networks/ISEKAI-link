[package]
name = "isekai-link-utils"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
channel-masque = { workspace = true }
# `cert` re-exports the certificate digest from there: everything that consumes
# it sits below this crate, so it owns it. Default features -- no msquic.
isekai-p2p-core = { workspace = true }
# The managed-domain certificate route (`cert`): building the CSR, digesting the
# key, and generating the key that stays here. Digesting a *certificate* went to
# `isekai-p2p-core` above, and `x509-parser` went with it -- nothing in this
# crate parses one any more.
rcgen = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
h3-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true, features = ["channel"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
schannel = { workspace = true }
windows = { workspace = true, features = ["Win32_Security_Cryptography"]}