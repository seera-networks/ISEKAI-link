# cargo-mutants: what a test suite would let through.
#
# The suite says the code passes. Mutation testing asks the other question --
# **which changes to the code would it still pass?** Every answer is a line
# that is exercised and not checked, which is the shape of an assertion that
# restates the code rather than testing its decision. This repository has found
# that by hand several times, by breaking something deliberately and watching
# the tests stay green; this does it exhaustively.
#
# Run it on what you changed:
#
#     git diff --relative origin/main... -- . > /tmp/pr.diff
#     cargo mutants --in-place --in-diff /tmp/pr.diff
#
# **`--relative` is as load-bearing as `--in-place`.** Run from anywhere in
# the repository, git writes paths from its root (`a/rust/privacy/src/lib.rs`);
# cargo-mutants matches them against the workspace it runs in, finds nothing,
# prints `No mutants to filter` and exits 0. Both of this tool's ways of
# failing here are silent successes, which is why CI checks for the second
# rather than trusting the command line.
#
# **`--in-place` is not optional here.** Several crates depend on paths outside
# the cargo workspace (`../submodules/tonic-h3`, `../submodules/msquic-async-rs`),
# and the default copies only the workspace -- so the copy cannot resolve them
# and every mutant is unviable. In place, the tree is mutated and restored; a
# run killed hard leaves one file changed, which `git checkout` undoes -- and
# the next run refuses with `cargo test failed in an unmutated tree` rather
# than testing against it, which is the right way round.

# **Tests that make a connection get longer.** The auto-set timeout comes from
# the baseline run, and a mutant that makes something loop or wait needs to be
# distinguishable from one that is merely slower under the load of a mutation
# run. The floor is what stops a fast baseline setting a timeout that a healthy
# test occasionally exceeds -- which reads as "caught" and hides the miss.
minimum_test_timeout = 60
timeout_multiplier = 3.0

exclude_globs = [
    # Examples are documentation that compiles. Nothing tests them, so every
    # mutant in one is missed, and the answer is never "write a test for the
    # example" -- it is the example's own subject that should be tested.
    "*/examples/*",
    # **`src/main.rs` is not excluded.** It was, for one draft, on the grounds
    # that `main` is argument parsing -- and that silently dropped every mutant
    # in `portal-server` and `portal-client`, whose real decisions live beside
    # `main` in the same file and do have tests (`check_serves_its_own_classes`,
    # `settle_grants`, `apply_policy_event`). Excluding the file to avoid
    # plumbing would hide the two programs this repository has spent the most
    # time on.
    #
    # `agent` is the exception, and by crate rather than by filename: 650 lines
    # of demo server in one `main.rs`, with no tests at all, so every mutant in
    # it is missed and none of them is news.
    "agent/**",
    # Generated by uniffi and built from the crates below it.
    "isekai-client-ffi/**",
    # Interface code: egui drawing, with no decision that a test could hold.
    "camera-ui/**",
    "camera-client/**",
    "camera-server/**",
    "webrtc-app/**",
]

exclude_re = [
    # `Display` and `Debug` render for a person to read. A mutant that changes
    # the wording is not a defect a test should be pinning, and pinning it
    # would make every improvement to a message a test change.
    #
    # **Matched against the description `--list` prints**, which spells the
    # trait out in full: `<impl std::fmt::Display for Refusal>::fmt`. A first
    # draft wrote `impl Display` and `impl Debug`, which match nothing at all,
    # and a bare `fmt` beside them, which matched everything they were meant
    # to -- and would also have caught any function whose signature merely
    # mentions `std::fmt`. One pattern that says what it means.
    "<impl [a-z:]*fmt::(Display|Debug) for",
]
