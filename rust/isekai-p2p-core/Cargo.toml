[package]
name = "isekai-p2p-core"
version = "0.1.0"
edition = "2024"

# P2P Connect protocol primitives: Endpoint keys + PoP, the Identity API and
# proxy control-plane clients, and the MASQUE relay legs. The high-level session
# API and the CLI live in the `isekai-p2p` crate, which builds on these.
[lib]
name = "isekai_p2p_core"
path = "src/lib.rs"

[features]
default = []
# The msquic-based HTTP/3 transport + MASQUE bind session. Off by default so the
# crate builds/tests without the (heavy) msquic native stack.
msquic = [
    "dep:channel-masque",
    "dep:h3-util",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio-stream",
    "dep:tokio-util",
]

[dependencies]
# Reading the names out of a peer certificate (`hostname`).
x509-parser = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
p256 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# Not optional: the HTTPS transport warns when TLS validation is skipped, and
# that path exists in every build.
tracing = { workspace = true }

# msquic H3 transport + MASQUE bind session (feature `msquic`).
channel-masque = { workspace = true, optional = true }
h3-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true, features = ["channel"] }
bytes = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["util"] }
tower-http = { workspace = true, optional = true, features = ["auth", "set-header"] }
tokio-stream = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
# Building certificates for the hostname-matching tests.
rcgen = { workspace = true }
axum = { workspace = true, features = ["json", "tokio", "http1"] }
