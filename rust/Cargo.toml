[workspace]
members = ["agent", "camera-client", "camera-core", "camera-server", "channel-masque", "isekai-client-ffi", "isekai-p2p", "isekai-p2p-core", "utils", "webrtc-app"]
resolver = "3"
package.edition = "2021"

[workspace.dependencies]
anyhow = "1"
argh = "0.1.10"
axum = { version = "0.8", default-features = false }
axum-h3 = { path = "../submodules/tonic-h3/axum-h3" }
base64 = "0.22.1"
channel-masque = { path = "channel-masque" }
camera-core = { path = "camera-core" }
isekai-p2p = { path = "isekai-p2p" }
isekai-p2p-core = { path = "isekai-p2p-core" }
bytes = "1"
eframe = "0.34.3"
egui = "0.34.3"
egui_plot = "0.35.0"
futures = "0.3"
futures-concurrency = "7.6.3"
h3 = { git = "https://github.com/hyperium/h3", rev = "385da3ad93407ec8eed15172f63561f6fb2bca40" }
h3-datagram = { git = "https://github.com/hyperium/h3", rev = "385da3ad93407ec8eed15172f63561f6fb2bca40" }
h3-quinn = { git = "https://github.com/hyperium/h3", rev = "385da3ad93407ec8eed15172f63561f6fb2bca40" }
h3-util = { path = "../submodules/tonic-h3/h3-util", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1.3"
hyper = { version = "1" , default-features = false}
isekai-link-utils = { path = "utils" }
# Pure-Rust JPEG encoder for the synthetic_server example, so generating test
# frames does not drag in OpenCV.
jpeg-encoder = "0.6"
msquic-async = { path = "../submodules/msquic-async-rs/msquic-async", default-features = false, features = ["tokio", "msquic-seera"] }
opencv = { version = "0.99", default-features = false, features = ["videoio", "imgproc", "imgcodecs"] }
# ECDSA P-256 / JWK for the P2P Connect Endpoint keypair, PoP and endpoint id.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "jwk", "pem", "pkcs8", "std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
rand = "0.8.4"
# HTTP(S) client for the Identity API (registration + Endpoint Token, plain HTTPS).
# `http2` so ALPN can negotiate h2 with the Identity API, which serves h1/h2 on
# TCP+TLS (and h3 on QUIC, reached through the msquic transport instead).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rustls = "0.23"
rustls-pemfile = "2"
schannel = "0.1.27"
serde = { version = "1.0.164", features = ["derive", "rc" ] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.16"
time = { version = "0.3", features = ["parsing", "formatting"] }
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6.8", features = ["full"] }
tower-jwt = { git = "https://github.com/masa-koz/tower-jwt.git", branch = "masa-koz/use-latest" }
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "time", "tracing-log"] }
webrtc = "0.17"
windows = "0.62"
