[package]
name = "isekai-p2p"
version.workspace = true
edition = "2021"

[lib]
name = "isekai_p2p"
path = "src/lib.rs"

# The P2P Connect CLI (formerly in the `isekai-agent` crate; binary name kept).
# It drives the same session facades this crate exposes to the camera apps.
[[bin]]
name = "isekai-agent"
path = "src/bin/isekai-agent.rs"

# High-level orchestration over the `isekai-agent` primitives. It always needs
# the relay legs, so — unlike `isekai-agent` — there is no msquic-free build.
[dependencies]
isekai-p2p-core = { workspace = true, features = ["msquic"] }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The Auth0 device-authorization flow and refresh (`auth`).
reqwest = { workspace = true }
# Reading the `expires_at` the proxy puts on a lease (`initiator`).
time = { workspace = true }
# Winding the relay leg down when a renewal says this Endpoint is refused
# (`initiator`).
tokio-util = { workspace = true }
# The registration and connection handles `peer` states the rules for.
msquic-async = { workspace = true }
# The key this Endpoint keeps and the dev certificate it falls back to
# (`endpoint_cert`).
rcgen = { workspace = true }
# The PKCS#12 blob is carried as base64 (`endpoint_cert`). Only the Windows
# path builds one, but `base64` is cheap and pure Rust, so it is not worth a
# target section -- unlike `openssl` below, which is.
base64 = { workspace = true }
# CLI-only.
argh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

# Windows only, and only to package a certificate as PKCS#12: msquic's Windows
# credential path imports a PFX blob, and its no-PFX fallback goes through an
# RSA provider that cannot take rcgen's ECDSA P-256 key (see
# src/endpoint_cert.rs). Vendored so the build does not depend on an OpenSSL
# installed on the machine. Off Windows the PEM path is used and OpenSSL is
# never linked -- which is the point of confining this to a target-specific
# dependency.
[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10.66", features = ["vendored"] }

[dev-dependencies]
axum = { workspace = true, features = ["json", "tokio", "http1"] }
p256 = { workspace = true }
