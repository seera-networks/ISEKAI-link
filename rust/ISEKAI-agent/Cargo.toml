[package]
name = "isekai-agent"
version = "0.1.0"
edition = "2024"

[lib]
name = "isekai_agent"
path = "src/lib.rs"

# The agent CLI. Requires the msquic feature (H3 transport + bind session), so a
# default `cargo build` builds only the (msquic-free) library.
[[bin]]
name = "isekai-agent"
path = "src/main.rs"
required-features = ["msquic"]

[features]
default = []
# The msquic-based HTTP/3 transport + MASQUE bind session. Off by default so the
# crate builds/tests without the (heavy) msquic native stack.
msquic = [
    "dep:channel-masque",
    "dep:h3-util",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:argh",
    "dep:tracing-subscriber",
]

[dependencies]
anyhow = { workspace = true }
argh = { workspace = true, optional = true }
base64 = { workspace = true }
p256 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# Not optional: the HTTPS transport warns when TLS validation is skipped, and
# that path exists in every build.
tracing = { workspace = true }

# msquic H3 transport + MASQUE bind session (feature `msquic`).
channel-masque = { workspace = true, optional = true }
h3-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true, features = ["channel"] }
bytes = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["util"] }
tower-http = { workspace = true, optional = true, features = ["auth", "set-header"] }
tokio-stream = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true, features = ["json", "tokio", "http1"] }
